<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Manager Online</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --primary: #1a237e; --gold: #c5a47e; --bg: #f4f6f9; --white: #fff;
            --radius: 15px; --shadow: 0 5px 20px rgba(0,0,0,0.05);
            --danger: #e74c3c; --success: #27ae60;
        }
        body { font-family: 'Prompt', sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #333; }
        * { box-sizing: border-box; }

        h1 { text-align: center; color: var(--primary); margin-bottom: 20px; }
        
        .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
        .tab-btn {
            background: white; border: 1px solid var(--primary); color: var(--primary);
            padding: 10px 25px; border-radius: 50px; cursor: pointer; transition: 0.3s;
            font-size: 1rem; font-weight: 500; display: flex; align-items: center; gap: 8px;
        }
        .tab-btn:hover, .tab-btn.active {
            background: var(--primary); color: var(--gold); border-color: var(--primary);
            box-shadow: 0 4px 10px rgba(26,35,126,0.3); transform: translateY(-2px);
        }

        .panel { background: var(--white); padding: 25px; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 25px; }

        /* Dashboard */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
        .stat-card { background: white; padding: 20px; border-radius: var(--radius); text-align: center; border-bottom: 4px solid var(--gold); box-shadow: var(--shadow); }
        .stat-val { font-size: 2rem; font-weight: bold; color: var(--primary); margin: 10px 0; }

        /* Tables Grid */
        .grid-tables { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
        .table-card {
            background: white; padding: 15px; border-radius: 12px; border: 1px solid #eee;
            border-left: 5px solid var(--primary); cursor: pointer; transition: 0.3s; position: relative;
        }
        .table-card:hover { transform: translateY(-5px); box-shadow: var(--shadow); border-left-color: var(--gold); }
        .table-alert { animation: pulse 1s infinite; border-left-color: var(--danger) !important; background: #fff5f5; }
        @keyframes pulse { 0%{opacity:1} 50%{opacity:0.8} 100%{opacity:1} }

        /* Cashier */
        .cashier-wrap { display: flex; gap: 20px; }
        .cashier-list { flex: 1; }
        .receipt { width: 350px; background: #2c3e50; color: white; padding: 25px; border-radius: 12px; display: flex; flex-direction: column; height: fit-content; }
        .receipt-body { flex: 1; font-family: monospace; margin: 20px 0; border-top: 1px dashed #555; border-bottom: 1px dashed #555; padding: 15px 0; max-height: 400px; overflow-y: auto; }
        .btn-pay { background: var(--gold); color: var(--primary); border: none; padding: 12px; width: 100%; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 1.1rem; }
        .btn-pay:disabled { background: #555; color: #888; cursor: not-allowed; }

        /* Form & Table */
        .form-row { display: flex; gap: 15px; margin-bottom: 15px; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-family: 'Prompt', sans-serif; }
        .btn-save { background: linear-gradient(135deg, var(--primary), #283593); color: white; padding: 12px; border: none; width: 100%; border-radius: 50px; cursor: pointer; }
        .btn-cancel { background: #95a5a6; color: white; padding: 12px; border: none; width: 100%; border-radius: 50px; cursor: pointer; margin-top: 10px; display: none; }
        
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th { background: var(--primary); color: white; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        .scroll-table { overflow-x: auto; }
        .btn-icon { border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; margin-right: 5px; }
        .btn-edit { background: #f39c12; color: white; }
        .btn-del { background: #e74c3c; color: white; }

        .filter-bar { display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 20px; }
        .chart-container { height: 300px; margin-bottom: 30px; position: relative; }

        @media(max-width: 768px) {
            .cashier-wrap { flex-direction: column; }
            .receipt { width: 100%; order: -1; }
            .form-row { flex-direction: column; }
        }
    </style>
</head>
<body>

    <h1>👔 Restaurant Manager Online</h1>

    <div class="tabs">
        <button class="tab-btn active" onclick="go('dash')" id="btn-dash"><i class="fa-solid fa-chart-pie"></i> แดชบอร์ด</button>
        <button class="tab-btn" onclick="go('cashier')" id="btn-cashier"><i class="fa-solid fa-cash-register"></i> แคชเชียร์</button>
        <button class="tab-btn" onclick="go('menu')" id="btn-menu"><i class="fa-solid fa-burger"></i> จัดการเมนู</button>
        <button class="tab-btn" onclick="go('hist')" id="btn-hist"><i class="fa-solid fa-clock-rotate-left"></i> ประวัติรายรับ</button>
    </div>

    <div id="tab-dash" class="tab-content">
        <div class="stats-grid panel">
            <div class="stat-card"><div>ยอดขายวันนี้</div><div class="stat-val" id="today-sales">0 ฿</div></div>
            <div class="stat-card"><div>ยอดขายเดือนนี้</div><div class="stat-val" id="month-sales">0 ฿</div></div>
            <div class="stat-card"><div>ออเดอร์สะสม</div><div class="stat-val" id="total-orders">0</div></div>
        </div>
        <div class="panel">
            <h2>🪑 โต๊ะที่กำลังใช้งาน</h2>
            <div id="dash-tables" class="grid-tables"></div>
        </div>
    </div>

    <div id="tab-cashier" class="tab-content" style="display:none">
        <div class="cashier-wrap">
            <div class="cashier-list panel">
                <h2>เลือกโต๊ะเพื่อรับเงิน</h2>
                <div id="cashier-tables" class="grid-tables"></div>
            </div>
            <div class="receipt">
                <h3 style="text-align:center; color:var(--gold); margin:0;">RECEIPT</h3>
                <div class="receipt-body" id="bill-items"><p style="text-align:center; color:#777">กรุณาเลือกโต๊ะ</p></div>
                <div style="text-align:right; font-size:1.5rem; font-weight:bold; margin-bottom:15px;">รวม: <span id="bill-total" style="color:var(--gold)">0</span></div>
                <button class="btn-pay" id="btn-pay" onclick="pay()" disabled>ยืนยันการรับเงิน</button>
            </div>
        </div>
    </div>

    <div id="tab-menu" class="tab-content" style="display:none">
        <div class="panel">
            <h2 id="form-title">เพิ่มเมนูใหม่</h2>
            <input type="hidden" id="editId">
            <div class="form-row">
                <input type="text" id="mName" placeholder="ชื่ออาหาร">
                <input type="number" id="mPrice" placeholder="ราคา">
            </div>
            <div class="form-row">
                <select id="mCat">
                    <option value="แนะนำ">⭐ แนะนำ</option>
                    <option value="อาหารจานเดียว">🍛 อาหารจานเดียว</option>
                    <option value="กับข้าว">🍲 กับข้าว</option>
                    <option value="เครื่องดื่ม">🥤 เครื่องดื่ม</option>
                    <option value="ของทานเล่น">🍟 ของทานเล่น</option>
                </select>
                <input type="file" id="mImg" accept="image/*">
            </div>
            <button class="btn-save" id="btn-save-menu" onclick="saveMenu()">บันทึกเมนู</button>
            <button class="btn-cancel" id="btn-cancel-edit" onclick="resetForm()">ยกเลิก</button>
        </div>
        <div class="panel scroll-table">
            <table id="menu-tb">
                <thead><tr><th>รูป</th><th>ชื่อ</th><th>ราคา</th><th>หมวด</th><th>จัดการ</th></tr></thead>
                <tbody id="menu-list"></tbody>
            </table>
        </div>
    </div>

    <div id="tab-hist" class="tab-content" style="display:none">
        <div class="panel">
            <div class="filter-bar">
                <label>เลือกเดือน:</label>
                <input type="month" id="hist-filter" onchange="renderHist()">
            </div>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px;">
                <div><h3 style="text-align:center;">📅 รายวัน</h3><div class="chart-container"><canvas id="dailyChart"></canvas></div></div>
                <div><h3 style="text-align:center;">🗓️ รายปี</h3><div class="chart-container"><canvas id="yearlyChart"></canvas></div></div>
            </div>
        </div>
        <div class="panel scroll-table">
            <h2>📝 รายการประวัติ</h2>
            <div style="margin-bottom:10px;">ยอดรวมเดือนนี้: <span id="month-total-display" style="color:var(--success); font-weight:bold;">0</span> ฿</div>
            <table id="hist-tb">
                <thead><tr><th>เวลา</th><th>โต๊ะ</th><th>รายการ</th><th>ยอดเงิน</th></tr></thead>
                <tbody id="hist-list"></tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, push, update, remove, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // --- 1. ใส่ Config ของคุณตรงนี้ ---
        const firebaseConfig = {
            apiKey: "AIzaSyDk4aCo5QjHesgZEfdUJ8aoSTMQv7W5vUQ",
            authDomain: "restaurant-menu-af41d.firebaseapp.com",
            databaseURL: "https://restaurant-menu-af41d-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "restaurant-menu-af41d",
            storageBucket: "restaurant-menu-af41d.firebasestorage.app",
            messagingSenderId: "110746441918",
            appId: "1:110746441918:web:5bc38b6b758b488d9f66ef"
            };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Global Vars for Data
        let ordersData = [];
        let menuData = [];
        let historyData = [];
        let billsData = [];
        let selectedTable = null;
        let dailyChart = null;
        let yearlyChart = null;
        let currentImgBase64 = null;

        // --- 2. LISTEN TO DATA (Realtime) ---
        onValue(ref(db, 'orders'), (s) => {
            ordersData = s.val() ? Object.entries(s.val()).map(([k,v]) => ({firebaseKey:k, ...v})) : [];
            refreshUI();
        });
        onValue(ref(db, 'menu'), (s) => {
            menuData = s.val() ? Object.entries(s.val()).map(([k,v]) => ({firebaseKey:k, ...v})) : [];
            renderMenu();
        });
        onValue(ref(db, 'sales_history'), (s) => {
            historyData = s.val() ? Object.entries(s.val()).map(([k,v]) => ({firebaseKey:k, ...v})) : [];
            renderHist();
            refreshUI(); // Update dashboard stats
        });
        onValue(ref(db, 'bills'), (s) => {
            billsData = s.val() ? Object.entries(s.val()).map(([k,v]) => ({firebaseKey:k, ...v})) : [];
            refreshUI();
        });

        // UI Helpers
        window.go = function(id) {
            document.querySelectorAll('.tab-content').forEach(e => e.style.display = 'none');
            document.querySelectorAll('.tab-btn').forEach(e => e.classList.remove('active'));
            document.getElementById('tab-'+id).style.display = 'block';
            document.getElementById('btn-'+id).classList.add('active');
            refreshUI();
            if(id === 'hist') renderHist(); // Re-render charts
        }

        function refreshUI() {
            renderDash();
            renderCashier();
        }

        // --- DASHBOARD ---
        function renderDash() {
            // Stats
            const now = new Date();
            const todayStr = now.toLocaleDateString();
            const currentMonth = now.getMonth();
            const currentYear = now.getFullYear();

            let todaySum = 0;
            let monthSum = 0;

            historyData.forEach(h => {
                const d = new Date(h.timestamp_num || h.id); // รองรับ legacy data
                if (d.getFullYear() === currentYear && d.getMonth() === currentMonth) {
                    monthSum += parseInt(h.amount);
                    if (d.toLocaleDateString() === todayStr) todaySum += parseInt(h.amount);
                }
            });

            document.getElementById('today-sales').innerText = todaySum.toLocaleString() + ' ฿';
            document.getElementById('month-sales').innerText = monthSum.toLocaleString() + ' ฿';
            document.getElementById('total-orders').innerText = historyData.length;

            // Active Tables
            const tables = {};
            ordersData.forEach(o => {
                if(!tables[o.table]) tables[o.table] = { total: 0, status: 'eating', allServed: true };
                tables[o.table].total += parseInt(o.total);
                if(o.status !== 'served') tables[o.table].allServed = false;
            });
            billsData.forEach(b => { if(tables[b.table]) tables[b.table].status = 'billing'; });

            const div = document.getElementById('dash-tables');
            div.innerHTML = Object.keys(tables).map(t => {
                const info = tables[t];
                const alertClass = info.status === 'billing' ? 'table-alert' : '';
                const icon = info.allServed ? '✅' : '👨‍🍳';
                return `
                    <div class="table-card ${alertClass}" onclick="go('cashier'); selectTable('${t}')">
                        <div style="position:absolute; top:10px; right:10px;">${icon}</div>
                        <h3>โต๊ะ ${t}</h3>
                        <div style="font-size:1.2rem; color:var(--primary); font-weight:bold;">${info.total} ฿</div>
                        <div style="font-size:0.8rem; color:${info.status==='billing'?'var(--danger)':'var(--success)'}">
                            ${info.status==='billing' ? '⚠️ เรียกเก็บเงิน' : 'กำลังทาน'}
                        </div>
                    </div>
                `;
            }).join('') || '<p style="text-align:center; color:#999; grid-column:1/-1;">ไม่มีลูกค้า</p>';
        }

        // --- CASHIER ---
        function renderCashier() {
            const uniqueTables = [...new Set(ordersData.map(o => o.table))];
            document.getElementById('cashier-tables').innerHTML = uniqueTables.map(t => `
                <div class="table-card" onclick="selectTable('${t}')"><h3>โต๊ะ ${t}</h3><p style="color:#777">คลิกเพื่อดูบิล</p></div>
            `).join('') || '<p>ไม่มีโต๊ะค้างชำระ</p>';
        }

        window.selectTable = function(tId) {
            selectedTable = tId;
            const myOrders = ordersData.filter(o => o.table == tId);
            let html = '';
            let sum = 0;
            
            myOrders.forEach(o => {
                o.items.forEach(i => {
                    const icon = i.done ? '✅' : '⏳';
                    html += `<div style="display:flex; justify-content:space-between; margin-bottom:5px;"><span>${icon} ${i.name}</span><span>${i.price}</span></div>`;
                    sum += i.price;
                });
            });
            
            document.getElementById('bill-items').innerHTML = `<h4>โต๊ะ ${tId}</h4>` + html;
            document.getElementById('bill-total').innerText = sum.toLocaleString();
            document.getElementById('btn-pay').disabled = false;
        }

        window.pay = function() {
            if(!selectedTable) return;
            if(!confirm(`ยืนยันรับเงินโต๊ะ ${selectedTable}?`)) return;

            const total = document.getElementById('bill-total').innerText.replace(/,/g,'');
            const myOrders = ordersData.filter(o => o.table == selectedTable);
            
            // Collect Items for history
            let itemNames = [];
            myOrders.forEach(o => o.items.forEach(i => itemNames.push(i.name)));
            
            // 1. Save History
            push(ref(db, 'sales_history'), {
                timestamp_num: Date.now(),
                date: new Date().toLocaleString(),
                table: selectedTable,
                amount: total,
                items: itemNames.join(', ')
            });

            // 2. Delete Orders
            myOrders.forEach(o => remove(ref(db, 'orders/' + o.firebaseKey)));
            
            // 3. Delete Bill Request
            const myBill = billsData.find(b => b.table == selectedTable);
            if(myBill) remove(ref(db, 'bills/' + myBill.firebaseKey));

            alert('✅ รับเงินเรียบร้อย');
            selectedTable = null;
            document.getElementById('bill-items').innerHTML = '<p>รับเงินแล้ว</p>';
            document.getElementById('btn-pay').disabled = true;
        }

        // --- MENU ---
        function renderMenu() {
            document.getElementById('menu-list').innerHTML = menuData.map(m => `
                <tr>
                    <td><img src="${m.img || 'https://via.placeholder.com/50'}" width="50" style="border-radius:5px; object-fit:cover;"></td>
                    <td>${m.name}</td>
                    <td>${m.price}</td>
                    <td>${m.category}</td>
                    <td>
                        <button class="btn-icon btn-edit" onclick="editMenu('${m.firebaseKey}')"><i class="fa-solid fa-pen"></i></button>
                        <button class="btn-icon btn-del" onclick="delMenu('${m.firebaseKey}')"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        window.saveMenu = function() {
            const id = document.getElementById('editId').value;
            const name = document.getElementById('mName').value;
            const price = document.getElementById('mPrice').value;
            const cat = document.getElementById('mCat').value;

            if(!name || !price) return alert('กรอกข้อมูลให้ครบ');
            
            const data = { name, price: parseInt(price), category: cat };
            if(currentImgBase64) data.img = currentImgBase64;
            else if(!id) data.img = 'https://via.placeholder.com/150'; // Default img for new

            if(id) {
                update(ref(db, 'menu/' + id), data);
                alert('แก้ไขเรียบร้อย');
            } else {
                push(ref(db, 'menu'), { ...data, id: Date.now() }); // id for compatibility
                alert('เพิ่มเมนูเรียบร้อย');
            }
            window.resetForm();
        }

        window.editMenu = function(key) {
            const item = menuData.find(m => m.firebaseKey === key);
            if(item) {
                document.getElementById('editId').value = key;
                document.getElementById('mName').value = item.name;
                document.getElementById('mPrice').value = item.price;
                document.getElementById('mCat').value = item.category;
                currentImgBase64 = item.img;
                
                document.getElementById('form-title').innerText = "แก้ไข: " + item.name;
                document.getElementById('btn-save-menu').innerText = "บันทึกการแก้ไข";
                document.getElementById('btn-save-menu').style.background = "#f39c12";
                document.getElementById('btn-cancel-edit').style.display = "block";
                document.getElementById('tab-menu').scrollIntoView({behavior:'smooth'});
            }
        }

        window.delMenu = function(key) {
            if(confirm('ลบเมนูนี้?')) remove(ref(db, 'menu/' + key));
        }

        window.resetForm = function() {
            document.getElementById('editId').value = "";
            document.getElementById('mName').value = "";
            document.getElementById('mPrice').value = "";
            document.getElementById('mImg').value = "";
            currentImgBase64 = null;
            document.getElementById('form-title').innerText = "เพิ่มเมนูใหม่";
            document.getElementById('btn-save-menu').innerText = "บันทึกเมนู";
            document.getElementById('btn-save-menu').style.background = "linear-gradient(135deg, var(--primary), #283593)";
            document.getElementById('btn-cancel-edit').style.display = "none";
        }

        // Image Handler
        document.getElementById('mImg').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const max = 300;
                    let scale = 1; if(img.width > max) scale = max/img.width;
                    canvas.width = img.width * scale; canvas.height = img.height * scale;
                    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                    currentImgBase64 = canvas.toDataURL('image/jpeg', 0.7);
                }
                img.src = evt.target.result;
            }
            reader.readAsDataURL(file);
        });

        // --- HISTORY ---
        window.renderHist = function() {
            const filterVal = document.getElementById('hist-filter').value || new Date().toISOString().slice(0,7);
            const [selYear, selMonth] = filterVal.split('-').map(Number);
            
            // Filter
            const filtered = historyData.filter(h => {
                const d = new Date(h.timestamp_num || h.id);
                return d.getFullYear() === selYear && (d.getMonth() + 1) === selMonth;
            });

            // Update Table
            let total = 0;
            const list = document.getElementById('hist-list');
            list.innerHTML = '';
            filtered.sort((a,b) => (b.timestamp_num||b.id) - (a.timestamp_num||a.id)).forEach(h => {
                total += parseInt(h.amount);
                list.innerHTML += `<tr><td>${h.date}</td><td>${h.table}</td><td>${h.items||'-'}</td><td style="color:var(--success); font-weight:bold;">${parseInt(h.amount).toLocaleString()}</td></tr>`;
            });
            document.getElementById('month-total-display').innerText = total.toLocaleString();

            // Daily Chart
            const daysInMonth = new Date(selYear, selMonth, 0).getDate();
            const dailyData = new Array(daysInMonth).fill(0);
            filtered.forEach(h => {
                const day = new Date(h.timestamp_num || h.id).getDate();
                dailyData[day-1] += parseInt(h.amount);
            });
            renderChart('dailyChart', dailyChart, 'line', Array.from({length:daysInMonth},(_,i)=>i+1), dailyData, 'รายวัน', '#1a237e');

            // Yearly Chart
            const yearlyData = new Array(12).fill(0);
            historyData.filter(h => new Date(h.timestamp_num||h.id).getFullYear() === selYear).forEach(h => {
                yearlyData[new Date(h.timestamp_num||h.id).getMonth()] += parseInt(h.amount);
            });
            renderChart('yearlyChart', yearlyChart, 'bar', ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'], yearlyData, 'รายปี', '#c5a47e');
        }

        function renderChart(id, chartVar, type, labels, data, label, color) {
            const ctx = document.getElementById(id).getContext('2d');
            if(id === 'dailyChart' && dailyChart) dailyChart.destroy();
            if(id === 'yearlyChart' && yearlyChart) yearlyChart.destroy();

            const config = {
                type: type,
                data: {
                    labels: labels,
                    datasets: [{
                        label: label,
                        data: data,
                        backgroundColor: type==='line'?'rgba(26,35,126,0.1)':color,
                        borderColor: color, borderWidth: 2, fill: type==='line', tension: 0.3
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: {display:false} } }
            };
            
            const newChart = new Chart(ctx, config);
            if(id === 'dailyChart') dailyChart = newChart;
            if(id === 'yearlyChart') yearlyChart = newChart;
        }

        // Set Default Month
        const n = new Date();
        document.getElementById('hist-filter').value = `${n.getFullYear()}-${(n.getMonth()+1).toString().padStart(2,'0')}`;

    </script>
</body>
</html>
